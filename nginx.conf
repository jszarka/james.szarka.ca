server {
    listen 80;
    server_name james.szarka.ca;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare fronts this origin over HTTP, so the security headers the browser
    # actually receives are the ones set here, not the ones in the 443 block below.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Content-Security-Policy
    #
    # Every page in this site is static HTML with no inline <style>, no style="..."
    # attribute, and no inline <script>. That is what allows this policy to omit
    # 'unsafe-inline' entirely. If you ever add an inline style or script, this
    # policy will block it — fix the page, do not weaken the policy.
    #
    # Allowlisted third parties, and why:
    #   static.cloudflareinsights.com  Cloudflare Web Analytics beacon (script)
    #   cloudflareinsights.com         where that beacon reports (connect)
    #   fonts.googleapis.com           Google Fonts stylesheet
    #   fonts.gstatic.com              Google Fonts font files
    # Cloudflare Email Obfuscation injects /cdn-cgi/scripts/.../email-decode.min.js,
    # which is same-origin and therefore covered by 'self'.
    #
    # WARNING: Cloudflare Rocket Loader injects INLINE script and will be blocked by
    # this policy. Confirm Rocket Loader is off (Speed > Optimization) before relying
    # on it. To roll back, comment out this single add_header and reload.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Do not advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    # Defence in depth. The dockerfile no longer copies dotfiles, config or docs
    # into the webroot, but nginx serves dotfiles by default, so deny them here
    # too: one of these two controls has to fail before /.git/config is reachable.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(md|conf|sh|yml|yaml|env|bak|log|sql|tfvars)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# NOTE: Do NOT include a 443 server block here. start.sh appends the
# SSL server block at runtime after the certificate files are mounted.
