<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Reusable compose deployment pattern</title>
  <desc id="desc">Flow chart of GitHub Actions, Infisical, SSH deployment, Docker Compose, and health validation.</desc>
  <style>
    .bg { fill: #fffefb; }
    .title { font: 700 34px Poppins, Arial, sans-serif; fill: #222; }
    .body { font: 500 18px Poppins, Arial, sans-serif; fill: #666; }
    .head { font: 700 23px Poppins, Arial, sans-serif; fill: #2e2e2e; }
    .node { fill: #fff; stroke: #e5d8c6; stroke-width: 2; rx: 20; }
    .flow { stroke: #fea621; stroke-width: 5; fill: none; stroke-linecap: round; }
    .backpill { fill: #fff4e8; stroke: #efc68e; stroke-width: 1.5; rx: 18; }
    .backtext { font: 700 17px Poppins, Arial, sans-serif; fill: #9d6b1d; }
  </style>
  <rect width="1200" height="720" class="bg"/>
  <a href="../../portfolio-platform-foundation.html">
    <rect x="856" y="58" width="264" height="42" class="backpill"/>
    <text x="988" y="85" class="backtext" text-anchor="middle">Back to Portfolio Case Study</text>
  </a>
  <text x="72" y="84" class="title">Reusable Deployment Pattern</text>
  <text x="72" y="116" class="body">Standardized workflow from GitHub branch activity</text>
  <text x="72" y="142" class="body">to Docker Compose rollout and health validation.</text>
  <rect x="52" y="272" width="188" height="120" class="node"/>
  <text x="82" y="322" class="head">GitHub Actions</text>
  <text x="94" y="354" class="body">workflow start</text>
  <rect x="282" y="272" width="188" height="120" class="node"/>
  <text x="334" y="322" class="head">Infisical</text>
  <text x="314" y="354" class="body">OIDC secrets</text>
  <rect x="512" y="272" width="188" height="120" class="node"/>
  <text x="573" y="322" class="head">Runner</text>
  <text x="542" y="354" class="body">SSH / rsync prep</text>
  <rect x="742" y="272" width="188" height="120" class="node"/>
  <text x="770" y="322" class="head">Docker Host</text>
  <text x="766" y="354" class="body">compose pull / up</text>
  <rect x="972" y="272" width="176" height="120" class="node"/>
  <text x="998" y="322" class="head">Health Check</text>
  <text x="994" y="354" class="body">service validate</text>
  <path d="M240 334 L282 334" class="flow"/>
  <path d="M470 334 L512 334" class="flow"/>
  <path d="M700 334 L742 334" class="flow"/>
  <path d="M930 334 L972 334" class="flow"/>
  <rect x="164" y="494" width="872" height="136" class="node"/>
  <text x="200" y="546" class="head">Control Objective</text>
  <text x="200" y="580" class="body">Use one documented deployment path with explicit secrets validation,</text>
  <text x="200" y="608" class="body">limited host roles, and reproducible remote rollout steps.</text>
</svg>
