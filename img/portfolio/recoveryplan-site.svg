<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BackupPlan.ca website portfolio illustration</title>
  <desc id="desc">Illustration of the BackupPlan.ca business website, recovery audit, backup validation, resilience readiness, disaster recovery, and continuity planning services.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#eef8f3"/><stop offset="100%" stop-color="#fffdf9"/></linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#174236"/><stop offset="100%" stop-color="#fea621"/></linearGradient>
    <style>.bg{fill:url(#bg)}.browser{fill:#fff;stroke:#d7e7df;stroke-width:2.5;rx:26}.bar{fill:#f5faf7}.dot{fill:#bfd7cb}.hero{fill:url(#hero);rx:22}.title{font:700 44px Poppins,Arial,sans-serif;fill:#fff}.sub{font:500 22px Poppins,Arial,sans-serif;fill:rgba(255,255,255,.92)}.label{font:700 28px Poppins,Arial,sans-serif;fill:#17362e}.body{font:500 19px Poppins,Arial,sans-serif;fill:#5e7068}.card{fill:#fff;stroke:#d7e7df;stroke-width:2;rx:18}.chip{fill:#fff7ed;stroke:#f2cf9b;stroke-width:1.5;rx:14}.chiptext{font:700 17px Poppins,Arial,sans-serif;fill:#9d6b1d}.accent{fill:#fea621}.line{stroke:#174236;stroke-width:4;fill:none;stroke-linecap:round}</style>
  </defs>
  <rect width="1200" height="720" class="bg"/>
  <rect x="74" y="68" width="1052" height="584" class="browser"/>
  <rect x="74" y="68" width="1052" height="58" class="bar" rx="26"/>
  <circle cx="118" cy="98" r="9" class="dot"/><circle cx="148" cy="98" r="9" class="dot"/><circle cx="178" cy="98" r="9" class="dot"/>
  <text x="242" y="106" class="body">backupplan.ca</text>
  <rect x="108" y="158" width="984" height="186" class="hero"/>
  <text x="148" y="222" class="title">Backups you can trust.</text>
  <text x="148" y="266" class="sub">Backup validation, recovery readiness, resilience risk,</text>
  <text x="148" y="298" class="sub">and practical disaster recovery planning.</text>
  <rect x="840" y="208" width="188" height="46" class="chip"/><text x="878" y="238" class="chiptext">Recovery Audit</text>
  <rect x="128" y="388" width="278" height="150" class="card"/><circle cx="172" cy="440" r="20" class="accent"/><text x="206" y="432" class="label">Validate</text><text x="206" y="462" class="body">Check what is</text><text x="206" y="490" class="body">protected, tested,</text><text x="206" y="518" class="body">and restorable.</text>
  <rect x="462" y="388" width="278" height="150" class="card"/><circle cx="506" cy="440" r="20" class="accent"/><text x="540" y="432" class="label">Harden</text><text x="540" y="462" class="body">Review access,</text><text x="540" y="490" class="body">offsite copies, and</text><text x="540" y="518" class="body">resilience gaps.</text>
  <rect x="796" y="388" width="278" height="150" class="card"/><circle cx="840" cy="440" r="20" class="accent"/><text x="874" y="432" class="label">Recover</text><text x="874" y="462" class="body">Build runbooks,</text><text x="874" y="490" class="body">restore order, and</text><text x="874" y="518" class="body">test priorities.</text>
  <path d="M406 463 L462 463" class="line"/><path d="M740 463 L796 463" class="line"/>
  <text x="132" y="600" class="body">Static business website • Recovery audit offer • Pricing cards • Contact path • Public-safe service messaging</text>
</svg>
