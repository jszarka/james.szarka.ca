<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Platform foundation architecture</title>
  <desc id="desc">Diagram showing documentation, Terraform Proxmox, and web delivery feeding a deployment workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5e8"/>
      <stop offset="100%" stop-color="#fffdf9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe6d72"/>
      <stop offset="100%" stop-color="#fea621"/>
    </linearGradient>
    <style>
      .label { font: 700 42px Poppins, Arial, sans-serif; fill: #1d1d1d; }
      .sub { font: 500 22px Poppins, Arial, sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #efdfcf; stroke-width: 2; rx: 26; }
      .head { font: 700 28px Poppins, Arial, sans-serif; fill: #222; }
      .tiny { font: 500 19px Poppins, Arial, sans-serif; fill: #666; }
      .chip { fill: #fff7ef; stroke: #f3d2af; stroke-width: 1.5; rx: 14; }
      .chiptext { font: 600 17px Poppins, Arial, sans-serif; fill: #7a4c0c; }
      .line { stroke: #f0b36c; stroke-width: 5; fill: none; stroke-linecap: round; }
      .backpill { fill: rgba(255,255,255,.18); stroke: rgba(255,255,255,.36); stroke-width: 1.5; rx: 18; }
      .backtext { font: 700 17px Poppins, Arial, sans-serif; fill: #fff; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="58" y="44" width="1084" height="132" rx="30" fill="url(#hero)"/>
  <a href="../../portfolio-platform-foundation.html">
    <rect x="836" y="72" width="264" height="42" class="backpill"/>
    <text x="968" y="99" class="backtext" text-anchor="middle">Back to Portfolio Case Study</text>
  </a>
  <text x="90" y="102" class="label" fill="#fff">Platform Foundation</text>
  <text x="90" y="136" class="sub" fill="#fff">Docs as code, infrastructure as code, and web delivery</text>
  <text x="90" y="164" class="sub" fill="#fff">designed as one operating system.</text>

  <rect x="78" y="224" width="320" height="236" class="box"/>
  <text x="108" y="276" class="head">docs</text>
  <text x="108" y="316" class="tiny">ADRs, runbooks, checklists,</text>
  <text x="108" y="344" class="tiny">public-safe architecture,</text>
  <text x="108" y="372" class="tiny">and GitHub Actions</text>
  <text x="108" y="400" class="tiny">guardrails.</text>
  <rect x="108" y="416" width="100" height="36" class="chip"/><text x="132" y="440" class="chiptext">ADRs</text>
  <rect x="220" y="416" width="126" height="36" class="chip"/><text x="244" y="440" class="chiptext">Runbooks</text>

  <rect x="440" y="224" width="320" height="236" class="box"/>
  <text x="470" y="276" class="head">terraform-proxmox</text>
  <text x="470" y="316" class="tiny">Guest inventory, cloud images,</text>
  <text x="470" y="344" class="tiny">cloud-init, and safe VM</text>
  <text x="470" y="372" class="tiny">modeling before import</text>
  <text x="470" y="400" class="tiny">or apply.</text>
  <rect x="470" y="416" width="138" height="36" class="chip"/><text x="494" y="440" class="chiptext">Cloud-Init</text>
  <rect x="620" y="416" width="102" height="36" class="chip"/><text x="644" y="440" class="chiptext">VM IaC</text>

  <rect x="802" y="224" width="320" height="236" class="box"/>
  <text x="832" y="276" class="head">webdev</text>
  <text x="832" y="316" class="tiny">Django, Groundwork,</text>
  <text x="832" y="344" class="tiny">TypeScript, dev containers,</text>
  <text x="832" y="372" class="tiny">tests, and pull-request</text>
  <text x="832" y="400" class="tiny">validation.</text>
  <rect x="832" y="416" width="112" height="36" class="chip"/><text x="858" y="440" class="chiptext">Django</text>
  <rect x="958" y="416" width="118" height="36" class="chip"/><text x="985" y="440" class="chiptext">CI / CD</text>

  <path d="M238 470 C238 526, 600 526, 600 572" class="line"/>
  <path d="M600 470 L600 572" class="line"/>
  <path d="M962 470 C962 526, 600 526, 600 572" class="line"/>

  <rect x="286" y="572" width="628" height="112" rx="28" fill="#fff" stroke="#f1c690" stroke-width="2.5"/>
  <text x="322" y="620" class="head">Reusable Delivery Pattern</text>
  <text x="322" y="650" class="tiny">GitHub Actions → secrets validation → SSH / rsync</text>
  <text x="322" y="676" class="tiny">→ Docker Compose → health checks</text>
 </svg>
