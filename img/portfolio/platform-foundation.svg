<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1200 720"><title id="title">Platform foundation architecture</title><desc id="desc">Diagram showing documentation, Terraform Proxmox, and web delivery feeding a deployment workflow.</desc><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff5e8"/><stop offset="100%" stop-color="#fffdf9"/></linearGradient><linearGradient id="hero" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fe6d72"/><stop offset="100%" stop-color="#fea621"/></linearGradient><style>.label{font:700 42px Poppins,Arial,sans-serif;fill:#1d1d1d}.sub{font:500 22px Poppins,Arial,sans-serif;fill:#555}.box{fill:#fff;stroke:#efdfcf;stroke-width:2;rx:26}.head{font:700 28px Poppins,Arial,sans-serif;fill:#222}.tiny{font:500 19px Poppins,Arial,sans-serif;fill:#666}.chip{fill:#fff7ef;stroke:#f3d2af;stroke-width:1.5;rx:14}.chiptext{font:600 17px Poppins,Arial,sans-serif;fill:#7a4c0c}.line{stroke:#f0b36c;stroke-width:5;fill:none;stroke-linecap:round}.backpill{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.36);stroke-width:1.5;rx:18}.backtext{font:700 17px Poppins,Arial,sans-serif;fill:#fff}</style></defs><rect width="1200" height="720" fill="url(#bg)"/><rect width="1084" height="132" x="58" y="44" fill="url(#hero)" rx="30"/><a href="../../portfolio-platform-foundation.html"><rect width="264" height="42" x="836" y="72" class="backpill"/><text x="968" y="99" class="backtext" text-anchor="middle">Back to Portfolio Case Study</text></a><text x="90" y="102" fill="#fff" class="label">Platform Foundation</text><text x="90" y="136" fill="#fff" class="sub">Docs as code, infrastructure as code, and web delivery</text><text x="90" y="164" fill="#fff" class="sub">designed as one operating system.</text><rect width="320" height="236" x="78" y="224" class="box"/><text x="108" y="276" class="head">docs</text><text x="108" y="316" class="tiny">ADRs, runbooks, checklists,</text><text x="108" y="344" class="tiny">public-safe architecture,</text><text x="108" y="372" class="tiny">and GitHub Actions</text><text x="108" y="400" class="tiny">guardrails.</text><rect width="100" height="36" x="108" y="416" class="chip"/><text x="132" y="440" class="chiptext">ADRs</text><rect width="126" height="36" x="220" y="416" class="chip"/><text x="244" y="440" class="chiptext">Runbooks</text><rect width="320" height="236" x="440" y="224" class="box"/><text x="470" y="276" class="head">terraform-proxmox</text><text x="470" y="316" class="tiny">Guest inventory, cloud images,</text><text x="470" y="344" class="tiny">cloud-init, and safe VM</text><text x="470" y="372" class="tiny">modeling before import</text><text x="470" y="400" class="tiny">or apply.</text><rect width="138" height="36" x="470" y="416" class="chip"/><text x="494" y="440" class="chiptext">Cloud-Init</text><rect width="102" height="36" x="620" y="416" class="chip"/><text x="644" y="440" class="chiptext">VM IaC</text><rect width="320" height="236" x="802" y="224" class="box"/><text x="832" y="276" class="head">webdev</text><text x="832" y="316" class="tiny">Django, Groundwork,</text><text x="832" y="344" class="tiny">TypeScript, dev containers,</text><text x="832" y="372" class="tiny">tests, and pull-request</text><text x="832" y="400" class="tiny">validation.</text><rect width="112" height="36" x="832" y="416" class="chip"/><text x="858" y="440" class="chiptext">Django</text><rect width="118" height="36" x="958" y="416" class="chip"/><text x="985" y="440" class="chiptext">CI / CD</text><path d="M238 470 C238 526, 600 526, 600 572" class="line"/><path d="M600 470 L600 572" class="line"/><path d="M962 470 C962 526, 600 526, 600 572" class="line"/><rect width="628" height="112" x="286" y="572" fill="#fff" stroke="#f1c690" stroke-width="2.5" rx="28"/><text x="322" y="620" class="head">Reusable Delivery Pattern</text><text x="322" y="650" class="tiny">GitHub Actions → secrets validation → SSH / rsync</text><text x="322" y="676" class="tiny">→ Docker Compose → health checks</text></svg>