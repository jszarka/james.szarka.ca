<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1200 720"><title id="title">Terraform Proxmox workspace</title><desc id="desc">Diagram of the Terraform Proxmox repository showing inventory, cloud image download, and VM provisioning.</desc><style>.bg{fill:#fbfcff}.title{font:700 34px Poppins,Arial,sans-serif;fill:#222}.body{font:500 18px Poppins,Arial,sans-serif;fill:#666}.head{font:700 25px Poppins,Arial,sans-serif;fill:#23324f}.panel{fill:#fff;stroke:#d8e1f0;stroke-width:2;rx:22}.link{stroke:#95aeda;stroke-width:4;fill:none;stroke-linecap:round}.backpill{fill:#eef4ff;stroke:#b9cae8;stroke-width:1.5;rx:18}.backtext{font:700 17px Poppins,Arial,sans-serif;fill:#38527f}</style><rect width="1200" height="720" class="bg"/><a href="../../portfolio-platform-foundation.html"><rect width="264" height="42" x="856" y="58" class="backpill"/><text x="988" y="85" class="backtext" text-anchor="middle">Back to Portfolio Case Study</text></a><text x="72" y="84" class="title">terraform-proxmox</text><text x="72" y="116" class="body">Infrastructure definition for a Proxmox-backed Docker host</text><text x="72" y="142" class="body">and safe guest inventory planning.</text><rect width="286" height="186" x="70" y="190" class="panel"/><text x="98" y="238" class="head">Inputs</text><text x="98" y="274" class="body">versions.tf / providers.tf</text><text x="98" y="304" class="body">terraform.tfvars.example</text><text x="98" y="334" class="body">.env.proxmox.example</text><rect width="312" height="242" x="444" y="162" class="panel"/><text x="472" y="210" class="head">Guest Spec</text><text x="472" y="246" class="body">Cloud image download</text><text x="472" y="276" class="body">Cloud-init user-data upload</text><text x="472" y="306" class="body">VM CPU, disk, network, startup</text><text x="472" y="336" class="body">Docker and observability hooks</text><rect width="286" height="186" x="844" y="190" class="panel"/><text x="872" y="238" class="head">Inventory First</text><text x="872" y="274" class="body">scripts/inventory-guests.sh</text><text x="872" y="304" class="body">API token-based cluster readout</text><text x="872" y="334" class="body">Import planning before apply</text><path d="M356 284 L444 284" class="link"/><path d="M756 284 L844 284" class="link"/><rect width="824" height="158" x="188" y="488" class="panel"/><text x="224" y="540" class="head">Operational Principle</text><text x="224" y="574" class="body">Model existing infrastructure carefully, reconcile configuration</text><text x="224" y="602" class="body">to no-op plans, then apply changes deliberately. The repository</text><text x="224" y="630" class="body">supports provisioning and controlled adoption of running guests into Terraform state.</text></svg>